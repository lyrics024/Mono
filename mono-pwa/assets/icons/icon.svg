<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B365D"/>
      <stop offset="100%" style="stop-color:#162d4d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="92" fill="url(#bg)"/>
  <!-- Cabinet doors slightly open -->
  <g transform="translate(256,256)">
    <!-- Cabinet body -->
    <rect x="-180" y="-200" width="360" height="400" rx="16" fill="#3a2e1f" opacity="0.8"/>
    <!-- Shelves -->
    <line x1="-160" y1="-100" x2="160" y2="-100" stroke="#c4a87e" stroke-width="2" opacity="0.3"/>
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#c4a87e" stroke-width="2" opacity="0.3"/>
    <line x1="-160" y1="100" x2="160" y2="100" stroke="#c4a87e" stroke-width="2" opacity="0.3"/>
    <!-- Left door partially open -->
    <g transform="rotateY(-20)">
      <rect x="-175" y="-200" width="175" height="400" rx="12" fill="#5c4033" opacity="0.9"/>
      <rect x="-165" y="-180" width="155" height="360" rx="6" fill="none" stroke="#c4a87e" stroke-width="1" opacity="0.15"/>
    </g>
    <!-- Right door partially open -->
    <g transform="rotateY(20)">
      <rect x="0" y="-200" width="175" height="400" rx="12" fill="#5c4033" opacity="0.9"/>
      <rect x="10" y="-180" width="155" height="360" rx="6" fill="none" stroke="#c4a87e" stroke-width="1" opacity="0.15"/>
    </g>
    <!-- M letterform -->
    <text x="0" y="60" text-anchor="middle" fill="rgba(245,244,237,0.9)" font-family="Noto Serif SC, Source Han Serif SC, serif" font-size="180" font-weight="400">M</text>
  </g>
</svg>
